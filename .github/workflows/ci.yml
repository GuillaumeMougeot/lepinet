name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/lepinet tests
      # Documentation is load-bearing here (see CLAUDE.md): a broken link or a stale status
      # board fails the build like a broken import. Pure stdlib, so it runs in the lint job.
      - run: python dev/060_doc_health.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CI runs on CPU, so it installs a CPU torch and the fastai stack directly rather than the
      # local cu130 pin from pyproject (which targets the Blackwell GPU box). The fastai ecosystem
      # is pinned to the versions the package needs (fastcore<2 keeps L.starmap; fastprogress 1.0.3
      # avoids the fasthtml/fastcore-2 conflict).
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      # Derive the dependency list from pyproject (minus torch/torchvision, installed above from the
      # CPU index) instead of hand-listing it: a hand-list silently drifts, and the package then
      # fails at import with e.g. "No module named 'psutil'" long after the dep was added.
      - run: |
          python - <<'EOF' > ci-requirements.txt
          import tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          skip = {"torch", "torchvision"}
          for d in deps:
              name = d.split("==")[0].split(">=")[0].split("<")[0].strip()
              if name not in skip:
                  print(d)
          EOF
          cat ci-requirements.txt
      - run: pip install -r ci-requirements.txt
      - run: pip install onnx onnxruntime pytest
      - run: pip install -e . --no-deps
      # Fail loudly here rather than inside a test if a runtime dependency is missing.
      - run: python -c "import lepinet, lepinet.train, lepinet.test, lepinet.export, lepinet.cli; print('imports ok')"
      # Unit tests (synthetic) + the self-contained end-to-end test (train a dummy model on a
      # generated dataset, then eval / predict / export). data/small-based tests stay opt-in.
      - run: CUDA_VISIBLE_DEVICES="" pytest tests/test_heads.py tests/test_loss_metrics_config.py tests/test_export.py tests/test_e2e_synthetic.py -W ignore
