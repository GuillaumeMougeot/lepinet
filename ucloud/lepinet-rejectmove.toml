# CPU budget (2026-11-25): 2 vCPU x 2h max = 4 core-hours worst case.
# File renames on the datasets drive (ucloud/rejectmove.sh): metadata work, one core is plenty.
name = "lepinet-rejectmove"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "cpu-amd-zen5-2-vcpu"
category = "cpu-amd-zen5"
provider = "ucloud"
[time_allocation]
hours = 1
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-rejectmove.sh"
run = "bash /work/lepinet/ucloud/rejectmove.sh"
[schedule]
auto_extend = "1h"
max_time = "2h"

[[resources]]
type = "file"
path = "/12383016/global_lepi"
