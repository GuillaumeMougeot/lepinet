# Where does the project's 6 TB go? Sizes of every project drive two levels down, plus random
# pread throughput on the ToL shards (ucloud/storage_audit.sh). Owner-requested, 2026-10-12.
# CPU budget: 1 vCPU x 6 h, no auto_extend = 6 core-hours worst case.
name = "lepinet-storage-audit"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "cpu-amd-zen5-1-vcpu"
category = "cpu-amd-zen5"
provider = "ucloud"
[time_allocation]
hours = 6
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-crawler.sh"
run = "bash ucloud/storage_audit.sh"

