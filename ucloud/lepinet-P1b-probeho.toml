name = "lepinet-P1b-probeho"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 6
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "uv pip install --no-deps open_clip_torch ftfy regex wcwidth && python dev/075_pretrained_trunk.py test --model '/work/lepinet/data/ucloud_models/*-lepinet-P1b-bioclip2-adapt-ucloud/*.pt' --parquet /work/lepinet/data/flemming/splits/flemming_probe_heldout_species.parquet --img-dir /work/flemming/images --out-dir /work/lepinet/data/ucloud_preds/P1b-probeho --test-set 0 --min-img-per-spc 0 --img-size 224 --aug-img-size 256 --batch-size 128 --num-workers 32 --no-drop-unknown-species"
[schedule]
auto_extend = "1h"
max_time = "12h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
