# TOL-3a: before resuming the crawl, measure what is left and what this node really offers.
#
# Two things the resume must not guess:
#   1. Rows left per host, which sets the crawl's duration and therefore its CPU budget.
#   2. Whether effective_cpus() (cgroup quota, then affinity) reports the job's allocation or the
#      host machine's cores. If it reports the host's, the crawler's new CPU guard would refuse a
#      correctly sized job -- so it is measured here, on 2 vCPU, before it can matter.
#
# Worst case: 2 vCPU x 1 h = 2 core-hours. No auto_extend.
name = "lepinet-tolprobe"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "cpu-amd-zen5-2-vcpu"
category = "cpu-amd-zen5"
provider = "ucloud"
[time_allocation]
hours = 1
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-crawler.sh"
run = "python -c \"import os,sys; sys.path.insert(0,'dev'); import importlib.util as u; s=u.spec_from_file_location('t','dev/082_tol_crawler.py'); m=u.module_from_spec(s); sys.modules['t']=m; s.loader.exec_module(m); print('CPUS cpu_count=',os.cpu_count(),'affinity=',len(os.sched_getaffinity(0)),'effective=',m.effective_cpus())\"; cat /sys/fs/cgroup/cpu.max; ls /work; python dev/082_tol_crawler.py remaining --manifest /work/treeoflife_200m/manifest --top 30"

[[resources]]
type = "file"
path = "/12383016/treeoflife_200m"
