# C3b step 2: retrain the C3 model on the reduced parquet. One factor changed: the training set.
name = "lepinet-C3b"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 10
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python -m lepinet train configs/20260808_C3b_holdout_common_effnetv2s.yaml"
[schedule]
auto_extend = "1h"
max_time = "16h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
