# H4: does backbone choice matter MORE under domain shift than in-distribution?
# Same flemming (names) set used for ConvNeXtV2-L (0.7122), so the three are directly comparable.
name = "lepinet-h4-dinov3cnxl"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 3
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "lepinet test --model '/work/lepinet/data/ucloud_models/*-lepinet-convnext-large-dinov3-320-6ep-oversample-mixup-ucloud/*.pt' --parquet /work/lepinet/data/flemming/flemming_names_labels.parquet --img-dir /work/flemming/images --out-dir /work/lepinet/data/ucloud_preds/h4-dinov3cnxl --test-set 0 --min-img-per-spc 0 --img-size 320 --aug-img-size 384 --batch-size 128 --num-workers 32 --no-drop-unknown-species"
[schedule]
auto_extend = "1h"
max_time = "6h"
[[resources]]
type = "file"
path = "/12347837/datasets/flemming"
read_only = true
