# lepinet-distill-effnetv2b0-from5ep: full-data run on a B200. Distilled b0 vs from-scratch b0 -> does distillation help?
#   ucloud q submit ucloud/lepinet-distill-b0.toml --name lepi-distill-b0
name = "lepinet-distill-effnetv2b0-from5ep"
replicas = 1

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"

[time_allocation]
hours = 12

[sync]
local = ".."
remote = "/12347837/repos/lepinet"

[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260725_ucloud_distill_effnetv2b0.yaml"

[schedule]
auto_extend = "2h"
max_time = "20h"

[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
