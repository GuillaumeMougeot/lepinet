# DINOv3 ViT-backbone smoke (vit_base_patch16_dinov3 @224, family 9717, 1 epoch) on a B200-MIG.
#   ucloud q submit ucloud/lepinet-dinov3-smoke.toml --name lepi-dinov3-smoke
name = "lepinet-dinov3-smoke"
replicas = 1

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "gpu-nvidia-b200-1-mig.1g"
category = "gpu-nvidia-b200"
provider = "ucloud"

[time_allocation]
hours = 3

[sync]
local = ".."
remote = "/12347837/repos/lepinet"

[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260725_ucloud_lepinet_dinov3_smoke.yaml"

[schedule]
auto_extend = "1h"
max_time = "6h"

[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
