# The real run: reproduce the 0.9148 baseline through src/lepinet on a B200.
#   ucloud q submit ucloud/lepinet-5ep-oversample.toml --name lepi-5ep --after lepi-smoke
# (--after is afterok: only launches if the smoke exits 0.)

name = "lepinet-5ep-oversample"
replicas = 1

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"

[time_allocation]
hours = 14                      # ~1:24/epoch x5 + preprocessing + margin; auto_extend covers overrun

[sync]
local = ".."
remote = "/12347837/repos/lepinet"

[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260724_ucloud_lepinet_5ep_oversample.yaml"

[schedule]
auto_extend = "2h"
max_time = "24h"

[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
