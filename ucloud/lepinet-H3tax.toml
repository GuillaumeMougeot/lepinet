name = "lepinet-H3tax"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 10
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python dev/069_sampled_softmax.py train configs/20260806_H3_taxneg1024_effnetv2s.yaml --n-negatives 1024 --taxonomy-negatives"
[schedule]
auto_extend = "3h"
max_time = "40h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
