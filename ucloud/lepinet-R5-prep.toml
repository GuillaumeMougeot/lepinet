# R5: the SAME ungated pseudo-labels as R4, replicated so every species contributes equally.
# R3 and R4 split the benchmarks and differ in two things at once; this is the third point on the
# distribution-shape axis, holding unique coverage at R4's 27,230 images. Reuses R4-prep's
# pseudo_nogate.parquet, so there is no re-labelling step.
name = "lepinet-R5-prep"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 3
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python dev/066_combine_pseudo.py --global-parquet /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet --pseudo-parquet /work/lepinet/data/flemming/splits/pseudo_nogate.parquet --out /work/lepinet/data/flemming/splits/combined_balanced.parquet --min-img-per-spc 50 --target-frac 0.02 --balance"
[schedule]
auto_extend = "1h"
max_time = "6h"
[[resources]]
type = "file"
path = "/12347837/datasets/flemming"
read_only = true

[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
