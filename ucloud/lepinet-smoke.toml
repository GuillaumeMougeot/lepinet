# Cheap validation of the lepinet path on a B200 (family 9717, 1 epoch, ~minutes).
#   ucloud q submit ucloud/lepinet-smoke.toml --name lepi-smoke
# Then queue the real run behind it (afterok):
#   ucloud q submit ucloud/lepinet-5ep-oversample.toml --name lepi-5ep --after lepi-smoke

name = "lepinet-smoke-9717"
replicas = 1

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"

[time_allocation]
hours = 2

[sync]
local = ".."                    # the lepinet repo root (this spec lives in ucloud/)
remote = "/12347837/repos/lepinet"

[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260724_ucloud_lepinet_smoke9717.yaml"

[schedule]
auto_extend = "1h"
max_time = "4h"

[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
