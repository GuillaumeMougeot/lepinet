name = "lepinet-G3b"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 24
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python dev/070_two_stage.py train configs/20260824_G3b_repeat_dinov3cnxl.yaml --init-from '/work/lepinet/data/ucloud_models/*-lepinet-G1-crt-dinov3cnxl-ucloud/*.pt' --freeze-body"
[schedule]
auto_extend = "3h"
max_time = "40h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true

[[resources]]
type = "file"
path = "/12347837/datasets/flemming"
read_only = true
