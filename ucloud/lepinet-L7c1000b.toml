name = "lepinet-L7c1000b"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 12
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260827_L7cap1000_effnetv2s_repeat.yaml"
[schedule]
auto_extend = "1h"
max_time = "16h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
