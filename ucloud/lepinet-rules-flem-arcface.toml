# The SYMMETRIC control. The plain head's shifted open-set re-scores from 0.5738 (max-logit) to
# 0.7533 (msp), which appears to beat ArcFace's 0.7272 -- but that 0.7272 is ALSO a dev/052
# max-logit number. Comparing plain-best against ArcFace-max-logit would repeat the exact error
# being corrected, in reverse. This gives ArcFace all five rules on the same benchmark.
name = "lepinet-rules-flem-arcface"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 6
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python dev/061_ood_scoring_rules.py --model '/work/lepinet/data/ucloud_models/*-lepinet-arcface-zscore-effnetv2s-ucloud/*.pt' --parquet /work/lepinet/data/flemming/flemming_names_labels.parquet --img-dir /work/flemming/images --out /work/lepinet/data/ucloud_preds/rules-flem-arcface.json --img-size 256 --num-workers 32"
[schedule]
auto_extend = "1h"
max_time = "12h"
[[resources]]
type = "file"
path = "/12347837/datasets/flemming"
read_only = true
