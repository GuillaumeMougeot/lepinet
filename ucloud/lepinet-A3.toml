name = "lepinet-A3"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 10
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260731_A3_distill_b0_from_A2.yaml"
[schedule]
auto_extend = "3h"
max_time = "40h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
