# ArcFace smoke (effnetv2_s + species-margin head, family 9717, 1 epoch) on a B200-MIG slice.
#   ucloud q submit ucloud/lepinet-arcface-smoke.toml --name lepi-arcface-smoke
name = "lepinet-arcface-smoke"
replicas = 1

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "gpu-nvidia-b200-1-mig.1g"
category = "gpu-nvidia-b200"
provider = "ucloud"

[time_allocation]
hours = 3

[sync]
local = ".."
remote = "/12347837/repos/lepinet"

[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260725_ucloud_lepinet_arcface_smoke.yaml"

[schedule]
auto_extend = "1h"
max_time = "6h"

[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
