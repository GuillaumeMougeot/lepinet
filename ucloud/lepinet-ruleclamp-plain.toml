# Tests the hypothesis from the clamp measurement: the plain head pins 67% of its logits to a
# single floor value, which is exactly the shape that MSP and entropy read -- so its near-chance
# open-set AUROC (0.601) may be caused by the TRANSFORM rather than the embedding. Scores on
# pre-clamp values. ArcFace is the control: it clamps almost nothing, so its numbers should be
# unchanged, and if they move instead then this measurement is wrong rather than the hypothesis.
name = "lepinet-ruleclamp-plain"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 6
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python dev/061_ood_scoring_rules.py --model '/work/lepinet/data/ucloud_models/*-lepinet-singlehead-species-effnetv2s-ucloud/*.pt' --parquet /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet --img-dir /work/global_lepi/images --out /work/lepinet/data/ucloud_preds/ruleclamp-plain.json --img-size 256 --num-workers 32 "
[schedule]
auto_extend = "1h"
max_time = "12h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
