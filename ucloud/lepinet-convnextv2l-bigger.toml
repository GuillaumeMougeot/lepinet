# The "bigger everything" teacher run: ConvNeXtV2-Large @320, bs96, 6 ep, oversample + MixUp.
#   ucloud q submit ucloud/lepinet-convnextv2l-bigger.toml --name lepi-big --after lepi-big-smoke
name = "lepinet-convnextv2l-bigger"
replicas = 1

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"

[time_allocation]
hours = 20                      # ~3 h/epoch estimate x6 + preprocessing; auto_extend covers a bad guess

[sync]
local = ".."
remote = "/12347837/repos/lepinet"

[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260724_ucloud_lepinet_convnextv2l_bigger.yaml"

[schedule]
auto_extend = "3h"
max_time = "40h"

[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
