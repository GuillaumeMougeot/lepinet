# Rebuilds the decontaminated test fold ON /work, so the evals can use it. dev/076 reads the
# ToL embedding cache's taxonomy columns straight from HuggingFace (no GPU, ~20 min) rather than
# us committing 1.4 MB of derived ids -- data/ is gitignored by convention and a split should be
# reproducible, not shipped.
name = "lepinet-tolsplit"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 4
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "uv pip install --no-deps huggingface_hub && mkdir -p /work/lepinet/data/tol_overlap && python dev/076_tol_overlap.py --parquet /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet --out /work/lepinet/data/tol_overlap && python -c \"import pandas as pd;d=pd.read_parquet('/work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet');c=set(pd.read_parquet('/work/lepinet/data/tol_overlap/test_ids_clean_of_tol.parquet')['gbifID']);it=d['set'].astype(str)=='0';k=(~it)|d['gbifID'].astype(str).isin(c);d[k].to_parquet('/work/lepinet/data/tol_overlap/global_clean_of_tol.parquet',index=False);print('clean test rows',int((k&it).sum()))\""
[schedule]
auto_extend = "1h"
max_time = "8h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
