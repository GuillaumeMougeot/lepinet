# CPU budget (2026-10-01): 2 vCPU x 4h max = 8 core-hours worst case.
# Local parquet I/O. Now streams its input, so it no longer needs the RAM of a large node.
# TOL-1b: reshard the manifest into 50k-row parts. `plan` writes one part per host, and the
# iNaturalist part is ~50 M rows -- a part is only marked done when it finishes in full, so a
# 24 h job slot would resume from zero every time. Resume granularity is the part size.
#
# Streams catalog.parquet (16.8 GB, 233,055,986 rows) twice -- once to count images per species,
# once to emit rows for species clearing min-50, stopping each at cap-2000. Writes
# manifest/host=<slug>/part-*.parquet, which is what `fetch` consumes.
#
# CPU-only on purpose: this is network and string work, no GPU involved. The 64-vCPU product is for
# parquet decode headroom, not parallelism -- the HF read is the bottleneck.
name = "lepinet-tolsplit"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "cpu-amd-zen5-2-vcpu"
category = "cpu-amd-zen5"
provider = "ucloud"
[time_allocation]
hours = 2
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-crawler.sh"
run = "python dev/082_tol_crawler.py split --manifest /work/treeoflife_200m/manifest --rows-per-part 50000"
[schedule]
auto_extend = "1h"
max_time = "4h"

[[resources]]
type = "file"
path = "/12383016/treeoflife_200m"
