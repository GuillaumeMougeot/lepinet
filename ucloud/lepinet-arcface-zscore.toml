name = "lepinet-arcface-zscore"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 10
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "lepinet train -c configs/20260729_ucloud_arcface_zscore_effnetv2s.yaml"
[schedule]
auto_extend = "2h"
max_time = "20h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
