# Builds all three capped parquets on /work in one job. Test fold asserted untouched.
name = "lepinet-L7-prep"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 3
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "mkdir -p /work/lepinet/data/head_caps && python dev/078_head_cap_sweep.py --parquet /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet --cap 250 --out /work/lepinet/data/head_caps/cap250.parquet && python dev/078_head_cap_sweep.py --parquet /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet --cap 500 --out /work/lepinet/data/head_caps/cap500.parquet && python dev/078_head_cap_sweep.py --parquet /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet --cap 1000 --out /work/lepinet/data/head_caps/cap1000.parquet"
[schedule]
auto_extend = "1h"
max_time = "6h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
