# C3b step 4: closed-set F1, to confirm removing 2.62 % of the data did not make this a
# materially worse model. If it did, C3b measures 'a weaker model' rather than 'a fair hold-out'.
# Reference: the C3 model scored 0.9148. Note the reduced parquet -- its test fold excludes the
# held-out taxa, which the model cannot predict at all.
name = "lepinet-C3b-eval"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 4
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python -m lepinet test --model '/work/lepinet/data/ucloud_models/*-lepinet-C3b-holdout-common-independent-effnetv2s-ucloud/*.pt' --parquet /work/lepinet/data/splits/c3b_train.parquet --img-dir /work/global_lepi/images --out /work/lepinet/data/ucloud_preds/C3b-eval"
[schedule]
auto_extend = "1h"
max_time = "8h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
