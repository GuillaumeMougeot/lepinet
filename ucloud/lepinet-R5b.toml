name = "lepinet-R5b"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 10
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python dev/070_two_stage.py train configs/20260827_R5b_repeat_effnetv2s.yaml --init-from '/work/lepinet/data/ucloud_models/*-lepinet-L4-crt-effnetv2s-ucloud/*.pt' --freeze-body"
[schedule]
auto_extend = "3h"
max_time = "40h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true

# The combined parquet points at trap images via ../../flemming/images/..., so that tree must be
# mounted for training too -- otherwise 5% of every epoch is missing files.
[[resources]]
type = "file"
path = "/12347837/datasets/flemming"
read_only = true
