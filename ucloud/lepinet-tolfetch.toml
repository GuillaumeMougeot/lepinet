# TOL-3: the TreeOfLife-200M crawl, writing straight to the `datasets` drive.
#
# SUPERSEDED 2026-10-01: the first crawl stored images at 256 px on the LONG side (images/), which
# starves the 256 px square-crop training input; the re-crawl at short side 256 runs on the
# workstation (/data/au761367/tol256s, zero UCloud core-hours) and is uploaded afterwards. This spec
# is kept as the UCloud fallback and now writes images_s256/, so it can never mix the two sizes.
# journal/2026-10-01-the-crawl-resized-the-wrong-side.md
#
# CPU BUDGET -- read before changing the product or max_time.
#   The first crawl (2026-08-28) ran on 64 vCPU for 63 h: 4,032 core-hours, 58 % of the project's
#   7,000 core-hour CPU allocation, for a job that measured ~1.1 cores per 240 img/s of decode and
#   spent its last 23 h at 22 img/s throttled by politeness caps, the node idle. Worst case under
#   auto_extend + max_time 168h would have been 10,752. See journal/2026-10-01-*cpu-budget*.md.
#
#   Now: 1 vCPU. The remaining 6.66 M rows sit on 17 hosts, almost all herbaria at the politeness
#   cap of 4 (sweetgum.nybg.org alone has 2.13 M). Their speed is set by per-host
#   politeness caps, not by cores, so duration is fixed and CPU spend scales only with node size.
#   JPEGs are decoded in the DCT domain (draft mode, 11x less CPU on large scans), so one core
#   keeps up, and the crawler streams parts, so memory fits 3 GB.
#   ucloud/budget_check.py (CI test + PreToolUse hook) refuses this spec if it grows past
#   8 vCPU or 300 worst-case core-hours without an owner sign-off line.
#
# The crawler also refuses to start if effective_cpus() exceeds --max-cpus, and pins library
# thread pools to the cgroup quota (UCloud reports 256 cores to os.cpu_count() on every node).
#
# Resumable: finished parts are skipped by their .meta.parquet; inside a part, images already on
# disk and complete (JPEG ends FFD9) are recorded without a request. Hosts that refused us are in
# manifest/blocked_hosts.json and are not contacted (--retry-blocked once access is granted).
name = "lepinet-tolfetch"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "cpu-amd-zen5-1-vcpu"
category = "cpu-amd-zen5"
provider = "ucloud"
[time_allocation]
hours = 24
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-crawler.sh"
# Bounded restart loop: the crawler's watchdog exits 75 after --stall-minutes without progress
# (dumping every thread's stack first -- the evidence for why it stalled); any other exit code ends
# the job. Restarts cost seconds: finished parts and on-disk images are skipped.
run = "for i in $(seq 1 30); do python dev/082_tol_crawler.py fetch --manifest /work/treeoflife_200m/manifest --images /work/treeoflife_200m/images_s256 --size 256 --fit short --variant medium --workers 1 --chunk 500 --max-cpus 1 --report-every 120 --stall-minutes 15; rc=$?; [ $rc -eq 75 ] || exit $rc; echo \"=== watchdog restart $i ===\"; done; exit 75"
[schedule]
auto_extend = "1h"
max_time = "150h"

[[resources]]
type = "file"
path = "/12383016/treeoflife_200m"

# Our own GBIF Lepidoptera download, read-only: dev/084 fill/extend rows are file:// paths into it
# (/work/global_lepi/images/<speciesKey>/<url_hash>.jpg), copied through the crawler's QC/resize.
[[resources]]
type = "file"
path = "/12383016/global_lepi"
read_only = true
