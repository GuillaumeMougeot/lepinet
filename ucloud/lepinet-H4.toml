name = "lepinet-H4"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 10
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "python dev/073_proxy_free.py train configs/20260809_H4_proxyfree_effnetv2s.yaml"
[schedule]
auto_extend = "1h"
max_time = "16h"
[[resources]]
type = "file"
path = "/12347837/datasets/global_lepi"
read_only = true
