<title>Paper Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a reading column the width of a printed page, with a quiet outline rail on the left. */
:root {
  --paper: #f3f5f1; --card: #ffffff; --ink: #1b201d; --muted: #5b645e; --rule: #d7dcd3;
  --accent: #2c5d4c; --accent-ink: #ffffff; --lamp: #a96d12; --lamp-bg: #fbf1de; --ok: #2f7a4d; --sel: #e4ece7;
  --read: "Newsreader", "Iowan Old Style", Georgia, serif;
  --ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111412; --card: #181c1a; --ink: #e5e9e3; --muted: #9aa49d; --rule: #2b312d;
  --accent: #82c2a8; --accent-ink: #0d1411; --lamp: #e3ab4f; --lamp-bg: #2d2412; --ok: #6cc28f; --sel: #223029; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #111412; --card: #181c1a; --ink: #e5e9e3; --muted: #9aa49d; --rule: #2b312d;
  --accent: #82c2a8; --accent-ink: #0d1411; --lamp: #e3ab4f; --lamp-bg: #2d2412; --ok: #6cc28f; --sel: #223029; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--ui); padding-inline: 16px; padding-block: 0 48px }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px }
header.top { max-width: 1120px; margin: 0 auto; padding-block: 20px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; border-bottom: 1px solid var(--rule); margin-bottom: 20px }
header.top h1 { font: 600 20px/1.2 var(--read); margin: 0; letter-spacing: .01em }
header.top .sub { color: var(--muted); font-size: 13px }
.meter { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.bar { width: 160px; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); width: 0 }
.banner { max-width: 1120px; margin: 0 auto 16px; padding: 10px 14px; border-radius: 6px; background: var(--lamp-bg); color: var(--ink); font-size: 13px; border: 1px solid var(--lamp) }

nav.outline { position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; padding-block: 4px 24px; font-size: 13px }
nav.outline details { border-bottom: 1px solid var(--rule); padding-block: 6px }
nav.outline summary { cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: baseline; list-style: none }
nav.outline summary::-webkit-details-marker { display: none }
nav.outline summary .n { margin-left: auto; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums }
nav.outline ol { list-style: none; margin: 6px 0 2px; padding: 0 }
nav.outline li button { all: unset; display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 3px 6px; border-radius: 4px; cursor: pointer; color: var(--muted); line-height: 1.35 }
nav.outline li button:hover, nav.outline li button:focus-visible { background: var(--sel); color: var(--ink) }
nav.outline li button[aria-current="true"] { background: var(--sel); color: var(--ink); font-weight: 500 }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); transform: translateY(-1px) }
.dot.done { background: var(--ok); border-color: var(--ok) }
.dot.discuss { background: var(--lamp); border-color: var(--lamp) }
.dot.edited { background: var(--accent); border-color: var(--accent) }
.navtoggle { display: none }

main { min-width: 0 }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px }
.eyebrow b { color: var(--accent); font-weight: 600 }
.why { color: var(--muted); font-size: 13px; margin: 4px 0 14px }
.context { font: 15px/1.55 var(--read); color: var(--muted); opacity: .75; max-width: 68ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; border-left: 2px solid var(--rule); padding-left: 12px }
.context:empty { display: none }
article.chunk { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 22px 26px; max-width: 74ch }
article.chunk h2 { font: 600 13px/1.3 var(--ui); color: var(--muted); margin: 0 0 12px; text-wrap: balance }
.prose { font: 18px/1.6 var(--read); }
.prose p { margin: 0 0 .8em } .prose p:last-child { margin-bottom: 0 }
.prose strong { font-weight: 600 }
.prose blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--lamp); color: var(--ink) }
.prose ul, .prose ol { padding-left: 1.3em; margin: 0 }
.prose li { margin-bottom: .35em }
.prose .ref { border-bottom: 1px dotted var(--muted) }
.prose img { display: block; width: 100%; border-radius: 4px; cursor: zoom-in; background: #fff; margin-bottom: 12px }
.tablewrap { overflow-x: auto; margin: 2px 0 }
.prose table { border-collapse: collapse; font: 14px/1.4 var(--ui); font-variant-numeric: tabular-nums; min-width: 100% }
.prose th, .prose td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top }
.prose th { font-weight: 600; border-bottom: 1.5px solid var(--ink) }
.prose mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100% }
.meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.chip { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--rule); color: var(--muted) }
.chip.ok { border-color: var(--ok); color: var(--ok) }
.chip.lamp { border-color: var(--lamp); color: var(--lamp) }
.applied { margin-top: 12px; font-size: 13px; color: var(--ok); max-width: 74ch }

.opts { display: grid; gap: 10px; margin-top: 14px }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; background: var(--paper) }
.opt:has(input:checked) { border-color: var(--accent); background: var(--sel) }
.opt input { margin-top: 4px; accent-color: var(--accent) }
.opt b { font-weight: 600 } .opt .rec { font: 600 11px var(--ui); color: var(--accent); letter-spacing: .05em; text-transform: uppercase; margin-left: 8px }
.opt .d { font: 15px/1.45 var(--read); color: var(--muted); margin-top: 2px }

.panel { max-width: 74ch; margin-top: 16px; display: grid; gap: 10px }
.panel label { font-size: 13px; font-weight: 500 }
textarea { width: 100%; border: 1px solid var(--rule); border-radius: 6px; background: var(--card); color: var(--ink); padding: 10px 12px; font: 14px/1.5 var(--ui); resize: vertical }
textarea#edit { font: 13px/1.55 var(--mono); min-height: 180px }
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.delta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
button.b { font: 500 14px var(--ui); padding: 8px 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer }
button.b:hover { border-color: var(--muted) }
button.b.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
button.b.flag { color: var(--lamp); border-color: var(--lamp) }
button.b[disabled] { opacity: .5; cursor: default }
.hint { font-size: 12px; color: var(--muted); margin-left: auto }
.suggest { border: 1px dashed var(--accent); border-radius: 6px; padding: 12px 14px; font: 16px/1.55 var(--read); white-space: pre-wrap; background: var(--card) }
.saved { font-size: 12px; color: var(--ok) }
.finish { max-width: 74ch; font: 18px/1.6 var(--read) }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: grid; place-items: center; padding: 16px; z-index: 10; cursor: zoom-out }
.lightbox img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 4px }

@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 12px }
  nav.outline { position: static; max-height: none; display: none }
  nav.outline.open { display: block }
  .navtoggle { display: inline-block }
  .meter { margin-left: 0 } .bar { width: 100px }
  article.chunk { padding: 16px }
  .prose { font-size: 17px }
  .hint { display: none }
}
@media (prefers-reduced-motion: no-preference) { article.chunk { animation: in .18s ease-out } @keyframes in { from { transform: translateY(4px) } } }
</style>

<header class="top">
  <h1>Paper Desk</h1>
  <span class="sub" id="sub">lepinet · paper/DRAFT.md</span>
  <div class="meter"><button class="b navtoggle" id="navtoggle" aria-expanded="false">Outline</button><span id="count"></span><div class="bar"><i id="bar"></i></div></div>
</header>
<div class="banner" id="banner" hidden></div>
<div class="wrap">
  <nav class="outline" id="outline" aria-label="Reading order"></nav>
  <main id="main"></main>
</div>

<script>
window.MathJax = { tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]] }, svg: { fontCache: "global" }, startup: { typeset: false } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<script>
const DATA = /*__DATA__*/null;
const items = DATA.items, byId = Object.fromEntries(items.map(it => [it.id, it]));
let reviews = {}, applied = {}, db = null, sample = null, cur = 0, local = false;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const words = s => (String(s).match(/\S+/g) || []).length;
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };

function renderMd(md) {
  const math = [];
  let s = md.replace(/\[\[([^\]]+)\]\]/g, "$1")
    .replace(/\$\$([\s\S]+?)\$\$/g, m => (math.push(m), `@@M${math.length - 1}@@`))
    .replace(/\$([^$\n]+?)\$/g, m => (math.push(m), `@@M${math.length - 1}@@`));
  let html = window.marked ? marked.parse(s) : `<p>${esc(s)}</p>`;
  html = html.replace(/@@M(\d+)@@/g, (_, i) => esc(math[i]))
    .replace(/<a href="(?!https?:)[^"]*">([\s\S]*?)<\/a>/g, '<span class="ref">$1</span>')
    .replace(/<table>/g, '<div class="tablewrap"><table>').replace(/<\/table>/g, "</table></div>");
  return html;
}
function typeset(el) {
  el.querySelectorAll("img").forEach(img => {
    const k = img.getAttribute("src"); if (DATA.figs[k]) img.src = DATA.figs[k];
    img.addEventListener("click", () => { const d = document.createElement("div"); d.className = "lightbox"; d.innerHTML = `<img src="${img.src}" alt="">`; d.onclick = () => d.remove(); document.body.append(d); });
  });
  if (window.MathJax?.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
}

function status(id) { const r = reviews[id]; if (!r) return ""; if (r.status === "discuss") return "discuss"; if (r.edited) return "edited"; return "done"; }
function firstOpen() { const i = items.findIndex(it => !reviews[it.id]); return i < 0 ? items.length : i; }

function renderOutline() {
  const nav = $("#outline"); const open = new Set([...nav.querySelectorAll("details[open]")].map(d => d.dataset.t));
  const tierOf = items[cur]?.tier;
  nav.innerHTML = DATA.tiers.map((t, ti) => {
    const its = items.map((it, i) => [it, i]).filter(([it]) => it.tier === ti); if (!its.length) return "";
    const done = its.filter(([it]) => reviews[it.id]).length;
    const isOpen = ti === tierOf || open.has(String(ti));
    return `<details data-t="${ti}" ${isOpen ? "open" : ""}><summary>${esc(t.name)}<span class="n">${done}/${its.length}</span></summary><ol>` +
      its.map(([it, i]) => `<li><button data-i="${i}" aria-current="${i === cur}"><span class="dot ${status(it.id)}"></span><span>${esc(label(it))}</span></button></li>`).join("") + "</ol></details>";
  }).join("");
  nav.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => go(+b.dataset.i));
}
function label(it) {
  if (it.kind === "decision") return it.title;
  if (it.kind === "figure") return (it.md.match(/\*\*(Figure \d+)\.\*\*/) || [, "Figure"])[1];
  const plain = it.md.replace(/[*_`$|#>\[\]()!]/g, " ").replace(/\s+/g, " ").trim();
  return (it.kind === "table" ? "Table: " : "") + plain.split(" ").slice(0, 7).join(" ") + "…";
}
function renderMeter() {
  const done = items.filter(it => reviews[it.id]).length;
  const wr = items.filter(it => reviews[it.id]).reduce((a, it) => a + (it.words || 0), 0);
  const wt = items.reduce((a, it) => a + (it.words || 0), 0);
  $("#count").textContent = `${done} of ${items.length} read · ${wr.toLocaleString()} / ${wt.toLocaleString()} words`;
  $("#bar").style.width = (100 * done / items.length) + "%";
}

// Re-render without wiping a textarea the reader is typing in.
function soft() { if (document.activeElement?.tagName === "TEXTAREA") { renderMeter(); renderOutline(); } else render(); }
function go(i) { cur = Math.max(0, Math.min(items.length, i)); store.set("pd.cur", items[cur]?.id || null); render(); window.scrollTo({ top: 0 }); $("#outline").classList.remove("open"); }

function render() {
  renderMeter(); renderOutline();
  const main = $("#main");
  if (cur >= items.length) {
    const flagged = items.filter(it => reviews[it.id]?.status === "discuss").length;
    main.innerHTML = `<div class="finish"><p>Everything has been read.</p><p>${flagged} item${flagged === 1 ? "" : "s"} flagged to discuss. Tell Claude in the terminal to apply the edits.</p></div>`;
    return;
  }
  const it = items[cur], tier = DATA.tiers[it.tier], r = reviews[it.id] || {}, ap = applied[it.id];
  const inTier = items.filter(x => x.tier === it.tier), k = inTier.indexOf(it) + 1;
  const prev = items[cur - 1] && items[cur - 1].tier === it.tier && items[cur - 1].kind !== "decision" && items[cur - 1].kind !== "figure" ? items[cur - 1].md : "";
  const draft = store.get("pd.draft." + it.id) || {};
  const editText = draft.edit ?? r.edited ?? it.md;
  let body;
  if (it.kind === "decision") {
    body = `<article class="chunk" id="chunk"><h2>Decision</h2><div class="prose"><p><strong>${esc(it.title)}.</strong> ${renderMd(it.md).replace(/^<p>|<\/p>\s*$/g, "")}</p></div>
      <div class="opts" role="radiogroup">${it.options.map(o => `<label class="opt"><input type="radio" name="choice" value="${o.key}" ${(draft.choice ?? r.choice) === o.key ? "checked" : ""}><span><b>${esc(o.label)}</b>${o.rec ? '<span class="rec">Recommended</span>' : ""}${o.md ? `<div class="d">${renderMd(o.md).replace(/<\/?p>/g, "")}</div>` : ""}</span></label>`).join("")}</div></article>`;
  } else {
    body = `<div class="context" aria-hidden="true">${prev ? esc(prev.replace(/[*$|]/g, "")) : ""}</div>
      <article class="chunk" id="chunk"><h2>${esc(it.section)}</h2><div class="prose" id="prose">${renderMd(r.edited || it.md)}</div>
      <div class="meta"><span class="chip">${it.kind}</span><span>${it.words} words</span>${r.edited ? '<span class="chip ok">your edit</span>' : ""}${r.status === "discuss" ? '<span class="chip lamp">to discuss</span>' : ""}${r.status === "done" && !r.edited ? '<span class="chip ok">read</span>' : ""}</div></article>`;
  }
  main.innerHTML = `<div class="eyebrow"><b>${esc(tier.name)}</b><span>${k} of ${inTier.length}</span><span>item ${cur + 1} of ${items.length}</span></div>
    <p class="why">${esc(tier.why)}</p>${body}
    ${ap ? `<div class="applied">Applied by Claude${ap.note ? ": " + esc(ap.note) : ""}</div>` : ""}
    <div class="panel">
      ${it.kind === "decision" ? "" : `<div class="row"><button class="b" id="toggleEdit">${draft.edit != null || r.edited ? "Hide edit" : "Edit text"}</button><button class="b" id="suggestBtn" hidden>Suggest a shorter version</button><span class="delta" id="delta"></span></div>
      <div id="editBox" ${draft.edit != null || r.edited ? "" : "hidden"}><label for="edit">Edit the text directly (markdown)</label><textarea id="edit" spellcheck="true">${esc(editText)}</textarea></div>
      <div id="suggestBox" hidden></div>`}
      <label for="note">Note to Claude (optional)</label>
      <textarea id="note" rows="2" placeholder="${it.kind === "decision" ? "Anything that changes the choice" : "e.g. cut this, check the number, move to appendix"}">${esc(draft.note ?? r.note ?? "")}</textarea>
      <div class="row"><button class="b" id="back" ${cur === 0 ? "disabled" : ""}>Back</button><button class="b flag" id="discuss">Discuss later</button><button class="b primary" id="done">Done, next</button><span class="saved" id="saved"></span><span class="hint">Ctrl+Enter: done, next</span></div>
    </div>`;
  if ($("#chunk")) typeset($("#chunk"));
  wire(it);
}

function wire(it) {
  const edit = $("#edit"), note = $("#note");
  const saveDraft = () => store.set("pd.draft." + it.id, { edit: edit && !$("#editBox").hidden && edit.value !== it.md ? edit.value : null, note: note.value, choice: document.querySelector("input[name=choice]:checked")?.value });
  const delta = () => { if (!edit || $("#editBox").hidden) { $("#delta").textContent = ""; return; } const a = it.words, b = words(edit.value); $("#delta").textContent = `${a} → ${b} words (${b - a >= 0 ? "+" : ""}${b - a})`; };
  if (edit) { edit.oninput = () => { saveDraft(); delta(); }; delta(); }
  note.oninput = saveDraft;
  document.querySelectorAll("input[name=choice]").forEach(x => x.onchange = saveDraft);
  $("#toggleEdit") && ($("#toggleEdit").onclick = () => { const b = $("#editBox"); b.hidden = !b.hidden; $("#toggleEdit").textContent = b.hidden ? "Edit text" : "Hide edit"; if (!b.hidden) edit.focus(); delta(); saveDraft(); });
  $("#back").onclick = () => go(cur - 1);
  $("#done").onclick = () => submit(it, "done");
  $("#discuss").onclick = () => submit(it, "discuss");
  if (sample && $("#suggestBtn")) { $("#suggestBtn").hidden = false; $("#suggestBtn").onclick = () => suggest(it); }
}

async function submit(it, st) {
  const edit = $("#edit"), editing = edit && !$("#editBox").hidden;
  const rec = { status: st, at: new Date().toISOString(), note: $("#note").value.trim() };
  if (editing && edit.value.trim() !== it.md.trim()) rec.edited = edit.value;
  const ch = document.querySelector("input[name=choice]:checked"); if (ch) rec.choice = ch.value;
  if (it.kind === "decision" && !ch && st === "done" && !rec.note) { $("#saved").textContent = "Pick an option or leave a note."; return; }
  reviews[it.id] = rec;
  try {
    if (db) await db.collection("reviews").doc(it.id).set(rec);
    else store.set("pd.reviews", reviews);
    store.set("pd.draft." + it.id, null);
  } catch (e) { $("#saved").textContent = "Not saved: " + (e.message || e.code) + ". Try again."; delete reviews[it.id]; return; }
  const next = items.findIndex((x, i) => i > cur && !reviews[x.id]);
  go(next < 0 ? firstOpen() : next);
}

async function suggest(it) {
  const box = $("#suggestBox"); box.hidden = false; box.className = "suggest"; box.textContent = "Thinking…";
  const src = $("#edit") && !$("#editBox").hidden ? $("#edit").value : it.md;
  const prompt = `You are copy-editing a research paper draft (hierarchical species classification of moths, domain shift, self-training at light traps). Rewrite the passage below so it is shorter and plainer. Keep every number, every claim, every citation marker such as [VERIFY], all LaTeX between $ signs, and any markdown table structure exactly. Use short sentences and no em dashes. Return only the rewritten passage in markdown, nothing else.\n\nSection: ${it.section}\n\nPassage:\n${src}`;
  try {
    const res = await sample(prompt, { onText: ({ text }) => { box.textContent = text; } });
    box.textContent = res.text;
    const use = document.createElement("div"); use.className = "row"; use.style.marginTop = "10px";
    use.innerHTML = `<button class="b">Use this</button><span class="delta">${words(src)} → ${words(res.text)} words</span>`;
    use.querySelector("button").onclick = () => { $("#editBox").hidden = false; $("#toggleEdit").textContent = "Hide edit"; $("#edit").value = res.text; $("#edit").dispatchEvent(new Event("input")); box.hidden = true; };
    box.append(use);
  } catch (e) { box.textContent = e.code === "not_granted" ? "Suggestions are not available here." : "No suggestion: " + (e.message || e.code); }
}

document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && $("#done")) { e.preventDefault(); $("#done").click(); } });
$("#navtoggle").onclick = () => { const o = $("#outline").classList.toggle("open"); $("#navtoggle").setAttribute("aria-expanded", o); };
if (DATA.built) $("#sub").textContent = `lepinet · paper/DRAFT.md · built ${DATA.built}`;

// First paint from browser storage; the shared store takes over when it answers.
reviews = store.get("pd.reviews") || {};
{ const id = store.get("pd.cur"); const i = items.findIndex(it => it.id === id); cur = i >= 0 ? i : firstOpen(); }
render();
window.addEventListener("load", () => { if (window.MathJax?.typesetPromise && $("#chunk")) typeset($("#chunk")); });

(async () => {
  const use = window.claude?.use;
  const d = use ? await window.claude.use("db") : null;
  if (!d) {
    local = true;
    const b = $("#banner"); b.hidden = false;
    b.textContent = "Your edits are saved in this browser only, so Claude cannot read them. Open the page on claude.ai while signed in.";
    return;
  }
  db = d; let first = true;
  db.collection("reviews").onSnapshot(s => {
    reviews = {}; s.docs.forEach(doc => reviews[doc.id] = doc.data());
    if (first) { first = false; const id = store.get("pd.cur"); const i = items.findIndex(it => it.id === id); cur = i >= 0 ? i : firstOpen(); }
    soft();
