# G1: the 198 M confirmation, stage 1 of 2 -- cRT on L5's representation.
#
# The scale discipline reserved ONE 198 M run for when the recipe stopped moving. F2 settled it, so
# this is that run -- and it deliberately reuses L5's existing representation rather than training a
# new one, because the claim under test is about the CLASSIFIER stages, not the backbone. Two frozen-
# trunk stages of 2 epochs each, roughly an hour apiece, instead of a fresh 8 h training.
#
# L5 (representation, no oversampling):  in-dist 0.9055 / probe 0.7497
# B8 (end-to-end, same ingredients):     in-dist 0.9060 / probe 0.7798   <- the comparison point
#
# At 20 M the staged recipe beat end-to-end in-distribution (+0.78) and trailed on probe (-1.65).
# Prediction for the pair (committed): G1 in-dist 0.912-0.920; G2 probe 0.780-0.800 with in-dist
# holding above 0.910. Falsified if G1's in-dist gain is under +0.5 pt -- cRT recovered +1.19 at
# 20 M, and three interventions have already behaved differently at this scale.
version: 1.0
desc: lepinet-G1-crt-dinov3cnxl-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-G1-crt-dinov3cnxl-ucloud
  model_arch_name: convnext_large.dinov3_lvd1689m
  head: marginal_arcface
  nb_epochs: 2
  base_lr: 0.0008
  batch_size: 96
  aug_img_size: 384
  img_size: 320
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  domain_aug: trap
  family_filter: []
  aug_kwargs:
    max_warp: 0.1
    max_lighting: 0.2
    p_lighting: 0.5
    flip_vert: true
    max_rotate: 20.0
    max_zoom: 1.2
  levels:
  - speciesKey
  - genusKey
  - familyKey
  arcface_scale: 30.0
  arcface_margin: 0.3
