# D2: distil A2 into fastvit_sa12 rather than effnetv2_b0. In the July backbone sweep
# fastvit_sa12 scored 0.8920 against b0's 0.8760 at the same bottleneck, so b0 -- not the
# teacher -- is the binding constraint on the shipped model. A6 sharpened that: the head is
# worth +0.97 pt at b0 scale and distillation only +0.44, so student capacity dominates.
# Prediction (committed): 0.895-0.905, i.e. clearing A3's 0.8833 by roughly the sweep's
# b0->fastvit gap. Above 0.905 means student capacity was under-diagnosed all along.
version: 1.0
# A3: re-run distillation with BOTH ends on the new architecture -- A2 (single head + ArcFace x
# z-score, 0.9216) as teacher, single-head student. Every earlier KD number used a multi-head
# teacher AND a multi-head student, so none of them tested the shipped architecture.
# Prediction (committed): ~0.88, i.e. still student-capacity-bound. If it clears 0.89 the
# "student is the ceiling" claim is wrong and the distillation section needs revisiting.
version: 1.0
desc: lepinet-D2-distill-fastvit-from-A2-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-D2-distill-fastvit-from-A2-ucloud
  model_arch_name: fastvit_sa12
  head: independent
  levels:
  - speciesKey
  hidden: 256
  distill_teacher: /work/lepinet/data/ucloud_models/*-lepinet-A2-singlehead-arcface-dinov3cnxl-ucloud/*.pt
  distill_alpha: 0.5
  distill_temperature: 1.0
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
