# M2: a second draw of marginal supervision. Its shifted score (0.6434) sits exactly one noise
# floor (0.0069) below the multi-head's 0.6503 -- the definition of indistinguishable. Two draws
# of one arm cannot prove equality, but they show whether 0.6434 was a low draw or the centre.
version: 1.0
# The owner's ACTUAL hierarchical idea: one species head, coarse levels are its marginals,
# supervised at all three levels DURING training (no genus/family parameters). Identical recipe to
# the multi-head baseline so only the head differs. Hypotheses in journal/2026-07-30-marginal-supervision.md
version: 1.0
desc: lepinet-M2-marginal-repeat-effnetv2s-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 256
  model_name: lepinet-M2-marginal-repeat-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: marginal
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
