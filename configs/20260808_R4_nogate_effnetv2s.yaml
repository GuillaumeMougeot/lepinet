# R4: self-training with NO confidence gate.
#
# The gate has been in this pipeline since day one, justified by a circularity risk that never
# materialised. What the last two runs showed instead:
#
#   R2  quantile 30%      99.84% labels, 156 species -> probe 0.7161
#   R3  per-species k=35  75.22% labels, 896 species -> probe 0.7585
#
# A 24.6-point DROP in label accuracy bought 4.24 points, purely from coverage. And the ungated set
# is 86.43% accurate over every predicted species -- better than R3's kept set on BOTH axes.
#
# Prediction (committed): probe 0.760-0.780, i.e. at least matching R3 and probably beating it,
# because ungated dominates R3's selection on accuracy AND coverage. Falsified below 0.7544
# (R3 - one floor), which would mean the gate contributes something the coverage/accuracy framing
# does not capture -- most likely that confidently-wrong labels are more harmful than uniformly
# noisy ones, which would be worth knowing on its own.
version: 1.0
desc: lepinet-R4-nogate-effnetv2s-ucloud
train:
  parquet_path: /work/lepinet/data/flemming/splits/combined_nogate.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 256
  model_name: lepinet-R4-nogate-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 2
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
  levels:
  - speciesKey
