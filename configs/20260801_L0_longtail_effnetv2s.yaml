# L0: the CONTROL nobody ran. Oversampling's +2.6 pt was measured on the multi-head under an
# older recipe, so what it is worth on the CURRENT architecture is unknown -- and the whole
# long-tail comparison is anchored to that number.
# Prediction (committed): 0.885-0.895, i.e. oversampling worth ~2 pt but LESS than the
# historical +2.6, because the cosine head's unit-norm prototypes already remove part of the
# bias oversampling corrects (that is tau-normalisation at tau=1, for free).
version: 1.0
desc: lepinet-L0-longtail-effnetv2s-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 256
  model_name: lepinet-L0-longtail-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.0
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
  levels:
  - speciesKey
