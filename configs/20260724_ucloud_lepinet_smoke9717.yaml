version: 1.0
# Cheap UCloud smoke: one family (9717), 1 epoch, to validate the whole lepinet path on a B200
# (setup/uv-sync, /work data access, num_workers throughput, train->save) in minutes before
# committing to the ~7h full run. Same recipe as the real config, just filtered + 1 epoch.
desc: lepinet-smoke-9717-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 64
  model_name: lepinet-smoke-9717-ucloud
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 1
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.3
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: ['9717']
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
