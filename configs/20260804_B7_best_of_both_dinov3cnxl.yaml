# B7: the two best shifted-axis levers, combined for the first time.
#   self-training on pseudo-labelled trap images  +4.58 pt probe at 20 M (B3)
#   dropping sqrt-oversampling                    +2.88 pt probe at 198 M (L5)
# Neither has been run with the other. B6 combines self-training with scale but keeps
# oversampling, which L5 has now shown costs 2.88 pt on exactly the axis B6 is trying to move.
#
# L5's config (F1 minus oversampling) on B3's combined parquet.
#
# Prediction (committed): probe 0.765-0.790. The two act differently -- one adds target-domain
# pixels, the other stops distorting the training distribution -- so they should mostly add, but
# both work partly by making the model less specialised to the GBIF distribution, so expect some
# overlap. Falsified as a composition if probe <= 0.7538 (L5's 0.7497 + one probe floor).
version: 1.0
desc: lepinet-B7-best-of-both-dinov3cnxl-ucloud
train:
  parquet_path: /work/lepinet/data/flemming/splits/combined_b3_3lvl.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-B7-best-of-both-dinov3cnxl-ucloud
  model_arch_name: convnext_large.dinov3_lvd1689m
  head: marginal_arcface
  nb_epochs: 6
  base_lr: 0.0008
  batch_size: 96
  aug_img_size: 384
  img_size: 320
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.0
  domain_aug: trap
  family_filter: []
  aug_kwargs:
    max_warp: 0.1
    max_lighting: 0.2
    p_lighting: 0.5
    flip_vert: true
    max_rotate: 20.0
    max_zoom: 1.2
  levels:
  - speciesKey
  - genusKey
  - familyKey
  arcface_scale: 30.0
  arcface_margin: 0.3
