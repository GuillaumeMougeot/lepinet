# P1b: P1a's classifier adapted on target-domain pseudo-labels. Trunk still frozen.
#
# Prediction (committed): probe 0.72-0.78, against T2b's 0.7515 on the identical procedure with
# our trunk. Matching it makes the recipe trunk-agnostic and takes the backbone out of the
# contribution list. Falsified below 0.70 -- the recipe would depend on our representation after
# all, which is equally worth knowing and keeps the backbone in.
#
# Derived from T2b's config so the ONLY factor changed is the trunk: same `arcface` head, same
# species-only levels, same oversample_power, same pseudo-label parquet in P1b. T2b froze A1's trunk
# (trained end-to-end on our labels) and adapted the classifier to probe 0.7515; P1 does the same
# from an encoder that has never seen our label set.
#
# img_size 224 / aug_img_size 256 are BioCLIP-2's native resolution. The trunk is frozen throughout.
# `dev/075_pretrained_trunk.py` swaps `ViTBody` for the BioCLIP-2 vision tower, undoes the
# dataloader's ImageNet normalisation and applies CLIP's (verified exact to 2.4e-07 in the
# preflight), and strips the text-alignment projection so the head sees the pooled 1024-d feature
# rather than the 768-d CLIP embedding.
#
# num_workers lowered 256 -> 64 on 2026-08-24 after both jobs stalled. At 256 the package's own
# memory helper printed "WARNING: 256 workers x ~1.2 GB anon is close to the 288 GB limit" at
# startup, and the run then sat at anon 87 GB + page cache 204 GB against a 288 GB cgroup --
# permanent reclaim, page cache evicted, every image re-read from network storage. Symptom was
# a progress bar that advanced in bursts and then froze for minutes at a time.
#
# COST IS UNMEASURED: a frozen ViT-L/14 at 224 on a B200 is not a throughput this project has
# measured. Read it from epoch 1 rather than extrapolating -- extrapolating from the wrong figure is
# what made B10's costing wrong by 2.3x.
version: 1.0
desc: lepinet-P1b-bioclip2-adapt-ucloud
train:
  parquet_path: /work/lepinet/data/flemming/splits/combined_b3_5x.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 64
  model_name: lepinet-P1b-bioclip2-adapt-ucloud
  model_arch_name: bioclip2
  head: arcface
  nb_epochs: 2
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 256
  img_size: 224
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
  levels:
  - speciesKey
  arcface_zscore: true
  arcface_scale: 30.0
  arcface_margin:
  - 0.3
