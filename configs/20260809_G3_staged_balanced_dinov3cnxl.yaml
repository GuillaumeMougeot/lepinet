# G3: G2 with balanced pseudo-labels. One factor changed: the parquet.
#
# G2 scored in-dist 0.9150 / probe 0.7648 / held-out 0.7600. At 20 M the same change (F2 -> R5) was
# worth +1.51 probe and +1.87 held-out for -0.07 in-distribution.
#
# Approved by the owner 2026-08-09, conditional on B9 showing the staged-vs-end-to-end gap closed.
# This is the ONE promotion to 198 M the scale discipline reserves, spent on the pair rather than a
# sweep: G2 and B8 both used the UNBALANCED pseudo-parquet, so re-running only one arm would repeat
# at 198 M exactly the unfairness B9 exists to remove at 20 M.
#
# Prediction (committed): probe 0.775-0.795, held-out 0.770-0.790, in-distribution within 0.3 pt of
# G2's 0.9150. Falsified if probe lands below 0.7689 (G2 + one floor), which would mean balanced
# replication is a small-model effect -- and would join the four other interventions this project
# has watched weaken with capacity.
version: 1.0
desc: lepinet-G3-staged-balanced-dinov3cnxl-ucloud
train:
  parquet_path: /work/lepinet/data/flemming/splits/combined_balanced_3lvl.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-G3-staged-balanced-dinov3cnxl-ucloud
  model_arch_name: convnext_large.dinov3_lvd1689m
  head: marginal_arcface
  nb_epochs: 2
  base_lr: 0.0008
  batch_size: 96
  aug_img_size: 384
  img_size: 320
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  domain_aug: trap
  family_filter: []
  aug_kwargs:
    max_warp: 0.1
    max_lighting: 0.2
    p_lighting: 0.5
    flip_vert: true
    max_rotate: 20.0
    max_zoom: 1.2
  levels:
  - speciesKey
  - genusKey
  - familyKey
  arcface_scale: 30.0
  arcface_margin: 0.3
