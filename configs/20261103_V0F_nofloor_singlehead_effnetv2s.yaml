# V0F (2026-11-03): recipe L's flat head (one species head, genus and family by marginalisation) WITHOUT the
# 50-image floor, so on mini_trainer's class set (12,632 species) and test set. The only change from the
# singlehead run (0.9135 / 0.9606 / 0.9739 with the floor) is min_img_per_spc 50 -> 0. Anchor for the
# integration (journal/engineering/2026-11-03-moving-the-recipe-into-mini-trainer.md) and same vocabulary as Nemo.
version: 1.0
desc: lepinet-V0F-nofloor-singlehead-effnetv2s-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 0
  num_workers: 256
  model_name: lepinet-V0F-nofloor-singlehead-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
  levels:
  - speciesKey
