# A6: the missing control for A3. A3 (0.8833) is compared against a from-scratch b0 at 0.8692 --
# but that control was MULTI-HEAD, while A3's student is single-head. So the +0.77 pt credited to
# distillation currently bundles the head change. This isolates it: single-head b0, no teacher.
# Prediction (committed): 0.870-0.878. If it lands near 0.883 then distillation from A2 bought
# nothing and the win was the head all along.
version: 1.0
desc: lepinet-A6-b0-singlehead-scratch-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-A6-b0-singlehead-scratch-ucloud
  model_arch_name: tf_efficientnetv2_b0
  head: independent
  levels:
  - speciesKey
  hidden: 256
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
