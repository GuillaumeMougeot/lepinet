# F3: one JOINT classifier stage instead of F2's two sequential ones.
#
# F2 did cRT then adaptation, 2 epochs each, and they composed (in-dist 0.9081 / probe 0.7541).
# F3 asks whether one stage doing both -- oversampling ON, trained on the combined parquet, 2
# epochs -- matches or beats that, from the same L0 representation. Cheaper by half if it does.
#
# Prediction (committed): in-dist 0.902-0.910 and probe 0.745-0.760, i.e. a wash with F2. The two
# objectives act on different axes (rebalancing on class frequency, adaptation on domain), so doing
# them at once should be equivalent to doing them in sequence. Falsified if either axis lands more
# than one floor below F2 (in-dist < 0.9081, probe < 0.7500), which would mean the objectives
# interfere and sequencing is doing real work.
version: 1.0
desc: lepinet-F3-joint-effnetv2s-ucloud
train:
  parquet_path: /work/lepinet/data/flemming/splits/combined_b3_5x.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 256
  model_name: lepinet-F3-joint-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 2
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
  levels:
  - speciesKey
