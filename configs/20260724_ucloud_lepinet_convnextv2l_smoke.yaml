version: 1.0
# Smoke for the "bigger everything" run: SAME backbone / resolution / batch / mixup as the full
# config (so it validates GPU memory + throughput on the B200), but one family + 1 epoch so it
# finishes in minutes. If this OOMs or diverges, it costs minutes, not ~20 h.
desc: lepinet-convnextv2l-smoke-9717-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 32
  model_name: lepinet-convnextv2l-smoke-9717-ucloud
  model_arch_name: convnextv2_large.fcmae_ft_in22k_in1k_384
  head: independent
  nb_epochs: 1
  base_lr: 0.0008
  batch_size: 96
  aug_img_size: 384
  img_size: 320
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.3
  grad_clip: 5.0
  oversample_power: 0.5
  mixup: 0.2
  family_filter: ['9717']
  aug_kwargs:
    max_warp: 0.1
    max_lighting: 0.2
    p_lighting: 0.5
    flip_vert: true
    max_rotate: 20.0
    max_zoom: 1.2
