# L6: cRT at 198 M, where oversampling costs the most.
#
# L4 showed at 20 M that oversampling's damage is in the REPRESENTATION, not the classifier: train
# the representation without it, then rebalance only the classifier, and the in-distribution gain
# arrives (+1.19) while the robustness is kept (probe 0.6539 vs 0.6293 for full oversampling).
#
# At 198 M oversampling costs 2.88 pt on probe (L5) -- twice its 20 M cost -- so this is where cRT
# has the most to recover. Stage 2 on L5's representation: backbone frozen, oversampling on, 2 ep.
#
# Prediction (committed): in-dist 0.915-0.921 (recovering most of the 1.64 pt L5 gave up) with probe
# holding within one floor of L5's 0.7497 rather than falling toward F1's 0.7209. If probe falls
# below 0.7456, the 20 M result does not transfer and the damage at scale IS in the classifier.
version: 1.0
desc: lepinet-L6-crt-dinov3cnxl-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-L6-crt-dinov3cnxl-ucloud
  model_arch_name: convnext_large.dinov3_lvd1689m
  head: marginal_arcface
  nb_epochs: 2
  base_lr: 0.0008
  batch_size: 96
  aug_img_size: 384
  img_size: 320
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  domain_aug: trap
  family_filter: []
  aug_kwargs:
    max_warp: 0.1
    max_lighting: 0.2
    p_lighting: 0.5
    flip_vert: true
    max_rotate: 20.0
    max_zoom: 1.2
  levels:
  - speciesKey
  - genusKey
  - familyKey
  arcface_scale: 30.0
  arcface_margin: 0.3
