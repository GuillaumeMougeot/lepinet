# H3: taxonomy-aware negatives at the SAME 1024 budget as H2's uniform arm.
#
# H2 measured uniform sampling losing 3.25 pt at 1024 negatives (8.5% coverage), with no plateau,
# and attributed it to the margin acting mostly against classes the model would never confuse --
# a uniform draw of 1024 contains a given congener only ~8.5% of the time.
#
# This tests that attribution at matched budget: draw ALL congeners of the batch's classes first,
# then fill uniformly to 1024. One factor against H2s1024 (0.8710); control is A1 at 0.9035.
#
# Prediction (committed): 0.890-0.900, i.e. recovering MOST of the 3.25 pt uniform lost. If it lands
# below 0.880 the loss is about HOW MANY negatives rather than WHICH, the whole sampling family is
# dead for 1 M classes, and the ANN hard-negative design is not worth building -- which would leave
# proxy-free (option F) as the only survivor. That negative is as useful as the positive.
#
# 20 M only. No 198 M run until the mechanism is settled here.
version: 1.0
desc: lepinet-H3-taxneg1024-effnetv2s-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 256
  model_name: lepinet-H3-taxneg1024-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: arcface
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
  levels:
  - speciesKey
  arcface_zscore: true
  arcface_scale: 30.0
  arcface_margin:
  - 0.3
