# B10: B8 with balanced pseudo-labels. End-to-end at 198 M, 6 epochs. One factor changed.
#
# B8 scored in-dist 0.9060 / probe 0.7798 / held-out 0.7816 and is the arm G2 lost to by 1.50 pt.
#
# Approved by the owner 2026-08-09, conditional on B9 showing the staged-vs-end-to-end gap closed.
# This is the ONE promotion to 198 M the scale discipline reserves, spent on the pair rather than a
# sweep: G2 and B8 both used the UNBALANCED pseudo-parquet, so re-running only one arm would repeat
# at 198 M exactly the unfairness B9 exists to remove at 20 M.
#
# Prediction REWRITTEN 2026-08-09 after B9, before this run started. The original text predicted
# probe 0.785-0.800 on the reasoning that balance would help end-to-end as much as it helps the
# staged recipe. B9 falsified exactly that at 20 M: balanced end-to-end scored probe 0.7635 and
# held-out 0.7342, i.e. -0.71 and -3.62 against its own unbalanced arm.
#
# Prediction (committed): probe 0.770-0.785, i.e. BELOW B8's 0.7798, and held-out 0.755-0.775, below
# B8's 0.7816. B10 is expected to LOSE. It is being run anyway because the whole point of the 198 M
# pair is to avoid asserting a 20 M interaction at scale without checking -- and this project has
# already watched five interventions change magnitude, and three change usable sign, between 20 M
# and 198 M. Falsified if probe exceeds 0.7798, which would mean the balance-hurts-end-to-end
# interaction is a small-model effect and B8 is not end-to-end's best 198 M configuration after all.
#
# If B10 loses as predicted, B8 remains the end-to-end arm of the headline comparison and G3 vs B8
# is the fair 198 M pair.
version: 1.0
desc: lepinet-B10-balanced-e2e-dinov3cnxl-ucloud
train:
  parquet_path: /work/lepinet/data/flemming/splits/combined_balanced_3lvl.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-B10-balanced-e2e-dinov3cnxl-ucloud
  model_arch_name: convnext_large.dinov3_lvd1689m
  head: marginal_arcface
  nb_epochs: 6
  base_lr: 0.0008
  batch_size: 96
  aug_img_size: 384
  img_size: 320
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.0
  domain_aug: trap
  family_filter: []
  aug_kwargs:
    max_warp: 0.1
    max_lighting: 0.2
    p_lighting: 0.5
    flip_vert: true
    max_rotate: 20.0
    max_zoom: 1.2
  levels:
  - speciesKey
  - genusKey
  - familyKey
  arcface_scale: 30.0
  arcface_margin: 0.3
