# A5: an EXACT repeat of the 0.9135 baseline (single species head + marginalisation).
# Nothing is changed. The point is the *spread*: this project routinely interprets 0.2-0.4 pt
# deltas and has never measured its run-to-run variation, so |0.9135 - x| is the threshold below
# which no single-run comparison in RESULTS.md should be believed.
#
# NOTE: lepinet has no `seed` key and seeds nothing -- head init, the oversampling sampler and the
# augmentation are all free-running. So an identical config IS the repeat; there is nothing to
# vary. That absence is exactly why the spread was never known.
version: 1.0
desc: lepinet-A5-seedrepeat-effnetv2s-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 256
  model_name: lepinet-A5-seedrepeat-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
  levels:
  - speciesKey
