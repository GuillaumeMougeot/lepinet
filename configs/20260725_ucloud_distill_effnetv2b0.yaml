version: 1.0
# Distillation demo: the 5ep effnetv2_s (0.9148, milestone baseline) as a MOCK teacher, distilled
# into a small tf_efficientnetv2_b0 student with a 256-dim bottleneck head (the shippable size from
# the app-compression sweep). Teacher & student share the class vocab (same min_img_per_spc=50,
# fold, no family filter) -- required for KD to align logits by index. Compare the student's test
# species macro-F1 to the from-scratch b0 control (20260725_ucloud_b0_fromscratch.yaml): distillation
# wins iff distilled > from-scratch. Everything else is the 0.9148 recipe.
desc: lepinet-distill-effnetv2b0-from5ep-effnetv2s-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-distill-effnetv2b0-from5ep-effnetv2s-ucloud
  model_arch_name: tf_efficientnetv2_b0
  head: independent
  hidden: 256
  distill_teacher: '/work/lepinet/data/ucloud_models/*-lepinet-heads-global-independent-muon-5ep-oversample-effnetv2s-ucloud/*.pt'
  distill_alpha: 0.5
  distill_temperature: 4.0
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
