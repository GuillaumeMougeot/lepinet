version: 1.0
# Smoke test for src/lepinet: the winning recipe (independent + muon + one_cycle + oversample +
# warmup + grad_clip + light aug) but 1 epoch on the small dataset, to shake out bugs fast before
# the full 5-epoch global run.
desc: lepinet-smoke-small
train:
  parquet_path: data/small/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.raw_subset.parquet
  img_dir: data/small/images
  out_dir: data/small/models
  fold: '1'
  min_img_per_spc: 50
  model_name: lepinet-smoke-small
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 1
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 300
  img_size: 224
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  num_workers: 8
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
