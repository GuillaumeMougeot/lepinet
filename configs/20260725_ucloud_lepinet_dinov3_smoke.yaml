version: 1.0
# DINOv3 (ViT) smoke: validates the ViT-backbone path (ViTBody + FlatHead + manual Learner) that
# lets a vanilla ViT be a backbone. Uses the cosine head (isolates the backbone change from the
# ArcFace change). vit_base_patch16_dinov3 @224 (patch16 -> 14x14 grid, matches pretrain; no
# pos-embed interpolation). Family 9717 + 1 epoch confirms: is_vit detection, pretrained load,
# Muon over ViT params, bf16 forward, train->save->reload round-trip.
desc: lepinet-dinov3-vitb-smoke-9717-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 64
  model_name: lepinet-dinov3-vitb-smoke-9717-ucloud
  model_arch_name: vit_base_patch16_dinov3.lvd1689m
  head: independent
  nb_epochs: 1
  base_lr: 0.0005
  batch_size: 64
  aug_img_size: 256
  img_size: 224
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.3
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: ['9717']
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
