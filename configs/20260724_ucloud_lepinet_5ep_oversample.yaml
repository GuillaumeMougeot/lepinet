version: 1.0
# The 0.9148 target, reproduced through the src/lepinet package on UCloud (B200).
# Recipe = run 20260716-154156 (test species macro-F1 0.9148): independent cosine head, Muon,
# one_cycle, warmup 0.5ep, grad_clip 5.0, sqrt-oversampling, light aug, 460->256, bs 64, 5 ep.
# precision: fp16 to match that original run exactly (the package would otherwise default bf16).
# Only the /work paths, num_workers and desc differ from the local oversample config.
desc: lepinet-heads-global-independent-muon-5ep-oversample-effnetv2s-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  # /work is a network mount (~90 ms/file); many readers park on I/O, so 256 on 48 vCPU is not
  # real oversubscription. Measured ~950 img/s, ~1:24/epoch on gpu-nvidia-b200-1-gpu.
  num_workers: 256
  model_name: lepinet-heads-global-independent-muon-5ep-oversample-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
