version: 1.0
# Stronger teacher candidate: DINOv3-distilled ConvNeXt-Large (same ~200M size as
# ConvNeXtV2-L 0.9316), same recipe -> isolates DINOv3 pretraining vs IN-22k FCMAE. Conv 4D map,
# drops into the proven PooledHead path (the dinov3-cnx-before-vit argument, journal).
version: 1.0
desc: lepinet-convnext-large-dinov3-320-6ep-oversample-mixup-ucloud
train:
  parquet_path: /work/global_lepi/0032836-250426092105405_processing_metadata_postprocessed_quality_filtered.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-convnext-large-dinov3-320-6ep-oversample-mixup-ucloud
  model_arch_name: convnext_large.dinov3_lvd1689m
  head: independent
  nb_epochs: 6
  base_lr: 0.0008
  batch_size: 96
  aug_img_size: 384
  img_size: 320
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  mixup: 0.2
  family_filter: []
  aug_kwargs:
    max_warp: 0.1
    max_lighting: 0.2
    p_lighting: 0.5
    flip_vert: true
    max_rotate: 20.0
    max_zoom: 1.2
