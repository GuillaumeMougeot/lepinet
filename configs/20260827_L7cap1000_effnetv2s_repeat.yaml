# Independent repeat of L7c1000. Nothing in lepinet seeds the training path, so this is a
# genuine second draw. Run because the claim rests on n = 1 and G3b showed a 3.74 pt spread
# between identical runs on a shifted benchmark.
version: 1.0
desc: lepinet-L7cap1000b-repeat-effnetv2s-ucloud
train:
  parquet_path: /work/lepinet/data/head_caps/cap1000.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  # /work is a network mount (~90 ms/file); many readers park on I/O, so 256 on 48 vCPU is not
  # real oversubscription. Measured ~950 img/s, ~1:24/epoch on gpu-nvidia-b200-1-gpu.
  num_workers: 64
  model_name: lepinet-L7cap1000b-repeat-effnetv2s-ucloud
  model_arch_name: efficientnet_v2_s
  head: independent
  nb_epochs: 5
  base_lr: 0.001
  batch_size: 64
  aug_img_size: 460
  img_size: 256
  optimizer: muon
  fp16: true
  precision: fp16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  family_filter: []
  aug_kwargs:
    max_warp: 0.0
    max_lighting: 0.0
    p_lighting: 0.0
    flip_vert: true
    max_rotate: 15.0
    max_zoom: 1.1
