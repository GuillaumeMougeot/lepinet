# G2: the 198 M confirmation, stage 2 -- classifier adaptation on G1's checkpoint.
#
# Completes the staged recipe at scale: L5's representation -> cRT (G1) -> adaptation (G2), both
# stages frozen-trunk and 2 epochs. Compared against B8's end-to-end 0.9060 / 0.7798.
# Prediction: probe 0.780-0.800 with in-dist holding above 0.910. See G1's header.
version: 1.0
desc: lepinet-G2-staged-dinov3cnxl-ucloud
train:
  parquet_path: /work/lepinet/data/flemming/splits/combined_b3_3lvl_2pct.parquet
  img_dir: /work/global_lepi/images
  out_dir: /work/lepinet/data/ucloud_models
  fold: '1'
  min_img_per_spc: 50
  num_workers: 128
  model_name: lepinet-G2-staged-dinov3cnxl-ucloud
  model_arch_name: convnext_large.dinov3_lvd1689m
  head: marginal_arcface
  nb_epochs: 2
  base_lr: 0.0008
  batch_size: 96
  aug_img_size: 384
  img_size: 320
  optimizer: muon
  fp16: true
  precision: bf16
  schedule: one_cycle
  warmup_epochs: 0.5
  grad_clip: 5.0
  oversample_power: 0.5
  domain_aug: trap
  family_filter: []
  aug_kwargs:
    max_warp: 0.1
    max_lighting: 0.2
    p_lighting: 0.5
    flip_vert: true
    max_rotate: 20.0
    max_zoom: 1.2
  levels:
  - speciesKey
  - genusKey
  - familyKey
  arcface_scale: 30.0
  arcface_margin: 0.3
