# B1 on the SHIFTED benchmark -- THE number for B1. Domain-mimicking augmentation is
# *expected* to cost in-distribution accuracy; the only question it answers is whether
# it recovers any of the 23 pt external gap.
name = "lepinet-B1-shift"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 3
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "lepinet test --model '/work/lepinet/data/ucloud_models/*-lepinet-B1-trapaug-singlehead-arcface-effnetv2s-ucloud/*.pt' --parquet /work/lepinet/data/flemming/flemming_names_labels.parquet --img-dir /work/flemming/images --out-dir /work/lepinet/data/ucloud_preds/B1-shift --test-set 0 --min-img-per-spc 0 --img-size 256 --aug-img-size 460 --batch-size 128 --num-workers 32 --no-drop-unknown-species"
[schedule]
auto_extend = "1h"
max_time = "6h"
[[resources]]
type = "file"
path = "/12347837/datasets/flemming"
read_only = true
