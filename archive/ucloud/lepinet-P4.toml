# P4: P3c's fine-tuned BioCLIP-2 + our adaptation stage on trap pseudo-labels, trunk FROZEN.
name = "lepinet-P4"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 8
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "uv pip install --no-deps open_clip_torch ftfy regex wcwidth && python dev/075_pretrained_trunk.py train configs/20260828_P4_bioclip2_adapted.yaml --freeze-body --init-from '/work/lepinet/data/ucloud_models/*-lepinet-P3c-bioclip2-ft-ucloud/*.pt'"
[schedule]
auto_extend = "1h"
max_time = "48h"
[[resources]]
type = "file"
path = "/12383016/global_lepi"
read_only = true

[[resources]]
type = "file"
path = "/12347837/datasets/flemming"
