# P3b: BioCLIP-2 fully fine-tuned on the global data, lr 1e-4. One of three LR arms.
name = "lepinet-P3b"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 16
[sync]
local = ".."
remote = "/12347837/repos/lepinet"
[setup]
script = "setup-lepinet.sh"
run = "uv pip install --no-deps open_clip_torch ftfy regex wcwidth && python dev/075_pretrained_trunk.py train configs/20260827_P3b_bioclip2_ft.yaml"
[schedule]
auto_extend = "1h"
max_time = "48h"
[[resources]]
type = "file"
path = "/12383016/global_lepi"
read_only = true
