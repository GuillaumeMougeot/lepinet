# Self-training with site LV (traps LV1, LV2, LV3, LV4) held out (fold site-LV); everything else is B3rep5x.
# Generated by dev/089_trap_holdout.py specs. Trains, scores the whole probe set, then deletes the
# fold's combined parquet and its preprocessing cache (~1 GB; reproducible from the script).
name = "lepinet-holdout-site-LV"
replicas = 1
[application]
name = "pytorch-te"
version = "26.05"
[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "ucloud"
[time_allocation]
hours = 11
[sync]
local = "../.."
remote = "/12347837/repos/lepinet"
[setup]
script = "../setup-lepinet.sh"
run = "set -e; cfg=$(python dev/089_trap_holdout.py prep --fold site-LV); lepinet train -c $cfg; lepinet test --model '/work/lepinet/data/ucloud_models/*-lepinet-holdout-site-LV-effnetv2s-ucloud/*.pt' --parquet /work/lepinet/data/flemming/splits/flemming_probe.parquet --img-dir /work/flemming/images --out-dir /work/lepinet/data/ucloud_preds/holdout-site-LV-probe --test-set 0 --min-img-per-spc 0 --img-size 256 --aug-img-size 460 --batch-size 128 --num-workers 32 --no-drop-unknown-species; rm -f /work/lepinet/data/flemming/splits/combined_holdout_site-LV.parquet /work/lepinet/data/combined_holdout_site-LV.lepinet.*.parquet"
[schedule]
auto_extend = "3h"
max_time = "40h"
[[resources]]
type = "file"
path = "/12383016/global_lepi"
read_only = true
[[resources]]
type = "file"
path = "/12347837/datasets/flemming"
read_only = true
